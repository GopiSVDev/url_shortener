spring.application.name=backend
server.port=4000
# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA / Hibernate settings for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS}
# Application Security & CORS
security.public-endpoints=${SECURITY_PUBLIC_ENDPOINTS}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.base-url=${APP_BASE_URL}
# Salt for the visitor hash (unique visitor counts); set a random value in production
app.analytics.visitor-salt=${ANALYTICS_VISITOR_SALT}
# Per-IP limits on link creation, login and register (RateLimitFilter); off for load tests
app.rate-limit.enabled=${RATE_LIMIT_ENABLED}
# Take the client IP from X-Forwarded-For when the request comes from a trusted proxy (private network
# addresses, e.g. the reverse proxy or the frontend container). Used for rate limits and unique visitors.
server.forward-headers-strategy=native
# Metrics (scraped by Prometheus for load testing)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=1ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s
management.metrics.distribution.percentiles-histogram.hikaricp.connections=true
server.tomcat.mbeanregistry.enabled=true
# Spring Security observations took ~10% of a request's CPU in profiling
management.observations.enable.spring.security=false
