spring.application.name=backend
server.port=4000
# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA / Hibernate settings for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS}
# Application Security & CORS
security.public-endpoints=${SECURITY_PUBLIC_ENDPOINTS}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.base-url=${APP_BASE_URL}
# Metrics (scraped by Prometheus for load testing)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=1ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s
management.metrics.distribution.percentiles-histogram.hikaricp.connections=true
server.tomcat.mbeanregistry.enabled=true
# was taking 10% cpu of a request
management.observations.enable.spring.security=false
# default is 200, that is a issue in limited resource
server.tomcat.threads.max=50

# No Hibernate session held open for the whole request; lazy loading happens inside @Transactional services
spring.jpa.open-in-view=false
